<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Blog</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
    <h1>Create Blog Post</h1>
    <form th:action="@{/blogs/create}" th:object="${blog}" method="post">
        Title: <input type="text" th:field="*{title}" required/><br/>
        Content: <textarea th:field="*{content}" required></textarea><br/>
        Author: <input type="text" th:field="*{author}" required/><br/>
        <button type="submit">Create</button>
    </form>
    <a href="/">Back</a>
</body>
</html>
